version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: sgbc-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: sgbc
      MYSQL_USER: sgbc_user
      MYSQL_PASSWORD: sgbc_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-db:/docker-entrypoint-initdb.d
    networks:
      - sgbc-net

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: sgbc-phpmyadmin
    restart: unless-stopped
    depends_on:
      - mysql
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: rootpass
      UPLOAD_LIMIT: 64M
    ports:
      - "8080:80"
    networks:
      - sgbc-net

volumes:
  mysql_data:

networks:
  sgbc-net:
    driver: bridge